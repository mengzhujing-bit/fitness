<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2E5D4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健身记录">
<link rel="manifest" href="manifest.json">
<title>健身记录</title>
<style>
  /* ================================================================
   * 极简主题：墨绿主色、清爽无广告感
   * 设计取舍：低饱和墨绿传递健康感但不刺眼，圆角统一12，平面无阴影
   * ================================================================ */
  :root {
    --primary: #2E5D4E;
    --primary-light: #3A7260;
    --bg: #F7F8F5;
    --card: #FFFFFF;
    --text: #1A1A1A;
    --text2: #4A4A4A;
    --text3: #999;
    --danger: #E5533C;
    --radius: 12px;
    --input-bg: #F2F3EE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 72px;
    -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }

  /* ===== 顶部标题栏 + 日期导航 ===== */
  header {
    background: var(--card);
    padding: 14px 16px;
    border-bottom: 1px solid #EEE;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  header .title { font-size: 18px; font-weight: 600; }
  header .date-nav { display: flex; align-items: center; gap: 8px; }
  header .date-nav button {
    background: none; border: none; font-size: 20px;
    color: var(--text3); cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  header .date-nav button:active { background: var(--input-bg); }
  header .date-label { font-size: 14px; color: var(--text2); min-width: 72px; text-align: center; }
  header .date-label.today { color: var(--primary); font-weight: 600; }

  /* ===== 统计卡片 ===== */
  .stats { display: flex; gap: 10px; padding: 12px 16px 0; }
  .stat-card {
    flex: 1; background: var(--card); border-radius: var(--radius); padding: 14px 16px;
  }
  .stat-card .label { font-size: 12px; color: var(--text3); }
  .stat-card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .stat-card .unit { font-size: 12px; color: var(--text3); margin-left: 3px; }
  .stat-card.burn .value { color: var(--primary); }
  .stat-card.net .value { font-size: 22px; }
  .stat-card.net .value.pos { color: var(--danger); }
  .stat-card.net .value.neg { color: var(--primary); }

  /* ===== 分区 ===== */
  .section { padding: 18px 16px 0; }
  .section h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text); }

  /* ===== 记录列表项 ===== */
  .list-item {
    background: var(--card); border-radius: var(--radius);
    padding: 13px 16px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
    transition: transform 0.15s;
  }
  .list-item:active { transform: scale(0.98); }
  .list-item .info { flex: 1; min-width: 0; }
  .list-item .title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .list-item .cal { font-weight: 600; color: var(--text2); font-size: 15px; white-space: nowrap; }
  .list-item.burn .cal { color: var(--primary); }
  .list-item .del {
    background: none; border: none; color: var(--text3);
    cursor: pointer; font-size: 18px; padding: 4px 6px; border-radius: 6px;
  }
  .list-item .del:active { color: var(--danger); background: #FEE; }

  /* ===== 空状态 ===== */
  .empty { text-align: center; padding: 28px; color: var(--text3); }
  .empty .icon { font-size: 36px; opacity: 0.35; }
  .empty .text { font-size: 14px; margin-top: 6px; }

  /* ===== 添加按钮（FAB） ===== */
  .fab {
    position: fixed; bottom: 84px; right: 50%; transform: translateX(240px);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--primary); color: #FFF; border: none;
    font-size: 28px; cursor: pointer; box-shadow: 0 4px 14px rgba(46,93,78,0.35);
    z-index: 100; transition: transform 0.15s;
  }
  .fab:active { transform: translateX(240px) scale(0.92); }

  /* ===== 底部导航 ===== */
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--card); border-top: 1px solid #EEE;
    display: flex; z-index: 100;
  }
  nav button {
    flex: 1; background: none; border: none; padding: 10px;
    font-size: 12px; color: var(--text3); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav button.active { color: var(--primary); font-weight: 600; }
  nav button .ic { font-size: 20px; }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: none; justify-content: center; align-items: flex-end; z-index: 200;
    transition: opacity 0.2s;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px; width: 100%; max-width: 480px;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .dialog h3 { font-size: 17px; margin-bottom: 14px; text-align: center; }
  .dialog input {
    width: 100%; padding: 12px 14px; border: none;
    background: var(--input-bg); border-radius: 10px; font-size: 15px;
    margin-bottom: 10px; outline: none;
  }
  .dialog input:focus { box-shadow: 0 0 0 1.5px var(--primary); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    background: var(--input-bg); border: none; border-radius: 16px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--text2);
    transition: background 0.15s;
  }
  .chip:active { background: #E0E3D8; }
  .chip.active { background: var(--primary); color: #FFF; }
  .dialog .btns { display: flex; gap: 10px; margin-top: 6px; }
  .dialog .btns button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel { background: var(--input-bg); color: var(--text2); }
  .btn-save { background: var(--primary); color: #FFF; }
  .btn-danger { background: var(--danger); color: #FFF; }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 14px; border-radius: 10px; cursor: pointer;
    font-size: 15px; color: var(--text);
  }
  .menu-item:active { background: var(--input-bg); }
  .menu-item .mi-icon { font-size: 20px; }

  /* ===== 周统计柱状图 ===== */
  .chart { display: flex; align-items: flex-end; gap: 5px; height: 180px; margin-top: 10px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .bar {
    width: 80%; background: var(--primary); border-radius: 4px;
    min-height: 2px; transition: height 0.3s; position: relative;
  }
  .bar.today { background: var(--primary-light); }
  .bar-val { font-size: 9px; color: var(--text3); margin-bottom: 2px; }
  .bar-label { font-size: 11px; color: var(--text3); margin-top: 5px; }
  .bar-label.today { color: var(--primary); font-weight: 600; }
  .summary-row {
    display: flex; justify-content: space-between;
    padding: 7px 0; font-size: 14px; color: var(--text2);
  }
  .summary-row .v { font-weight: 600; color: var(--text); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: #333; color: #FFF; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; z-index: 300;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ===== 导出导入按钮 ===== */
  .data-actions { display: flex; gap: 10px; margin-top: 16px; }
  .data-actions button {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    background: var(--input-bg); color: var(--text2);
    font-size: 14px; cursor: pointer; font-weight: 500;
  }
  .data-actions button:active { background: #E0E3D8; }
</style>
</head>
<body>

<!-- ===== 顶部：标题 + 日期导航 ===== -->
<header>
  <div class="title" id="headerTitle">健身记录</div>
  <div class="date-nav" id="dateNav">
    <button onclick="changeDay(-1)">‹</button>
    <span class="date-label today" id="dateLabel" onclick="goToday()">今天</span>
    <button onclick="changeDay(1)">›</button>
  </div>
</header>

<!-- ===== 记录页 ===== -->
<div id="pageRecord">
  <div class="stats">
    <div class="stat-card">
      <div class="label">摄入</div>
      <div><span class="value" id="intakeVal">0</span><span class="unit">千卡</span></div>
    </div>
    <div class="stat-card burn">
      <div class="label">消耗</div>
      <div><span class="value" id="burnVal">0</span><span class="unit">千卡</span></div>
    </div>
    <div class="stat-card net">
      <div class="label">净值</div>
      <div><span class="value" id="netVal">0</span><span class="unit">千卡</span></div>
    </div>
  </div>

  <div class="section">
    <h2>饮食</h2>
    <div id="foodList"></div>
  </div>

  <div class="section">
    <h2>运动</h2>
    <div id="exerciseList"></div>
  </div>
</div>

<!-- ===== 统计页 ===== -->
<div id="pageStats" style="display:none; padding: 16px;">
  <div class="section" style="padding:0;">
    <h2>本周总览</h2>
    <div class="summary-row"><span>运动总时长</span><span class="v" id="weekMin">0 分钟</span></div>
    <div class="summary-row"><span>运动总消耗</span><span class="v" id="weekCal">0 千卡</span></div>
    <div class="summary-row"><span>饮食总摄入</span><span class="v" id="weekIntake">0 千卡</span></div>
    <div class="summary-row"><span>净收支</span><span class="v" id="weekNet">0 千卡</span></div>
  </div>
  <div class="section" style="padding:0; margin-top:20px;">
    <h2>每日消耗</h2>
    <div class="chart" id="chart"></div>
  </div>
  <div class="section" style="padding:0; margin-top:20px;">
    <h2>数据管理</h2>
    <div class="data-actions">
      <button onclick="exportData()">📤 导出备份</button>
      <button onclick="importData()">📥 导入恢复</button>
    </div>
  </div>
</div>

<!-- 添加按钮 -->
<button class="fab" id="fab" onclick="showAddSheet()">+</button>

<!-- 底部导航 -->
<nav>
  <button class="active" id="tabRecord" onclick="switchTab('record')">
    <span class="ic">📝</span>记录
  </button>
  <button id="tabStats" onclick="switchTab('stats')">
    <span class="ic">📊</span>统计
  </button>
  <button id="tabPose" onclick="window.location.href='pose.html'">
    <span class="ic">🎯</span>检测
  </button>
</nav>

<!-- 弹窗容器 -->
<div class="overlay" id="overlay">
  <div class="dialog" id="dialog"></div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<!-- 隐藏的文件导入 input -->
<input type="file" id="importFile" accept=".json" style="display:none">

<script>
/* ================================================================================
 * 数据层：localStorage 持久化
 *
 * 存储结构：
 *   fitness_food     → [{id, name, cal, ts}, ...]
 *   fitness_exercise → [{id, type, dur, cal, ts}, ...]
 *   fitness_seeded   → '1'（标记示例数据已插入，避免重复）
 *
 * ts 为毫秒时间戳，所有日期判断基于本地时区。
 * ================================================================================ */
const LS = { food: 'fitness_food', ex: 'fitness_exercise', seeded: 'fitness_seeded' };

/** 读取列表，解析失败返回空数组（容错） */
function load(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch (e) { console.warn('数据解析失败:', e); return []; }
}
/** 保存列表 */
function save(key, list) {
  try { localStorage.setItem(key, JSON.stringify(list)); }
  catch (e) { toast('存储失败，可能空间不足'); }
}
/** 生成自增 id */
function nextId(list) {
  return list.length ? Math.max(...list.map(r => r.id)) + 1 : 1;
}

/* ================================================================================
 * 日期工具函数
 * ================================================================================ */
/** 判断时间戳 ts 是否属于指定日期（年月日都匹配） */
function isSameDay(ts, date) {
  const d = new Date(ts);
  return d.getFullYear() === date.getFullYear() &&
         d.getMonth() === date.getMonth() &&
         d.getDate() === date.getDate();
}
/** 格式化时分：21:30 */
function hm(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
/** 星期几：返回"一"~"日" */
function weekday(d) {
  return ['日','一','二','三','四','五','六'][new Date(d).getDay()];
}
/** 日期标签：今天/昨天/前天/MM月DD日 */
function dateLabel(date) {
  const today = new Date();
  const diff = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime() -
                           new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime()) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return `${date.getMonth()+1}月${date.getDate()}日`;
}
/** HTML 转义，防止 XSS 注入 */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================================================================================
 * 应用状态
 * ================================================================================ */
let currentDay = new Date();      // 当前查看的日期
let currentTab = 'record';        // 当前 Tab：record / stats

/* ================================================================================
 * 渲染：记录页
 * ================================================================================ */
function renderRecord() {
  const foods = load(LS.food);
  const exs = load(LS.ex);

  // 过滤出当前查看日期的记录
  const dayFood = foods.filter(r => isSameDay(r.ts, currentDay));
  const dayEx = exs.filter(r => isSameDay(r.ts, currentDay));

  // 统计卡片
  const intake = dayFood.reduce((s, r) => s + r.cal, 0);
  const burn = dayEx.reduce((s, r) => s + r.cal, 0);
  const net = intake - burn;
  document.getElementById('intakeVal').textContent = intake;
  document.getElementById('burnVal').textContent = burn;
  const netEl = document.getElementById('netVal');
  netEl.textContent = (net > 0 ? '+' : '') + net;
  netEl.className = 'value ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '');

  // 日期标签
  const labelEl = document.getElementById('dateLabel');
  const lbl = dateLabel(currentDay);
  labelEl.textContent = lbl;
  labelEl.classList.toggle('today', lbl === '今天');

  // 饮食列表
  const foodEl = document.getElementById('foodList');
  if (!dayFood.length) {
    foodEl.innerHTML = emptyHTML('🍽️', '该日无饮食记录');
  } else {
    // 按时间倒序排列
    const sorted = [...dayFood].sort((a, b) => b.ts - a.ts);
    foodEl.innerHTML = sorted.map(r => `
      <div class="list-item" onclick="editFood(${r.id})">
        <div class="info">
          <div class="title">${esc(r.name)}</div>
          <div class="sub">${hm(r.ts)}</div>
        </div>
        <span class="cal">${r.cal} 千卡</span>
        <button class="del" onclick="event.stopPropagation();delFood(${r.id})">×</button>
      </div>`).join('');
  }

  // 运动列表
  const exEl = document.getElementById('exerciseList');
  if (!dayEx.length) {
    exEl.innerHTML = emptyHTML('🏃', '该日无运动记录');
  } else {
    const sorted = [...dayEx].sort((a, b) => b.ts - a.ts);
    exEl.innerHTML = sorted.map(r => `
      <div class="list-item burn" onclick="editEx(${r.id})">
        <div class="info">
          <div class="title">${esc(r.type)}</div>
          <div class="sub">${r.dur} 分钟 · ${hm(r.ts)}</div>
        </div>
        <span class="cal">${r.cal} 千卡</span>
        <button class="del" onclick="event.stopPropagation();delEx(${r.id})">×</button>
      </div>`).join('');
  }
}

function emptyHTML(icon, text) {
  return `<div class="empty"><div class="icon">${icon}</div><div class="text">${text}</div></div>`;
}

/* ================================================================================
 * 渲染：统计页
 * ================================================================================ */
function renderStats() {
  const foods = load(LS.food);
  const exs = load(LS.ex);
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 6);
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

  // 最近7天每天的数据
  const days = [];
  for (let i = 0; i < 7; i++) {
    const dayStart = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i).getTime();
    const dayEnd = dayStart + 86400000;
    const cal = exs.filter(r => r.ts >= dayStart && r.ts < dayEnd).reduce((s, r) => s + r.cal, 0);
    const dur = exs.filter(r => r.ts >= dayStart && r.ts < dayEnd).reduce((s, r) => s + r.dur, 0);
    const intake = foods.filter(r => r.ts >= dayStart && r.ts < dayEnd).reduce((s, r) => s + r.cal, 0);
    days.push({ ts: dayStart, cal, dur, intake, isToday: dayStart === todayStart });
  }

  // 汇总
  const totalCal = days.reduce((s, d) => s + d.cal, 0);
  const totalDur = days.reduce((s, d) => s + d.dur, 0);
  const totalIntake = days.reduce((s, d) => s + d.intake, 0);
  document.getElementById('weekCal').textContent = totalCal + ' 千卡';
  document.getElementById('weekMin').textContent = totalDur + ' 分钟';
  document.getElementById('weekIntake').textContent = totalIntake + ' 千卡';
  const net = totalIntake - totalCal;
  document.getElementById('weekNet').textContent = (net > 0 ? '+' : '') + net + ' 千卡';

  // 柱状图：按消耗量绘制
  const maxVal = Math.max(...days.map(d => d.cal), 1);
  document.getElementById('chart').innerHTML = days.map(d => `
    <div class="bar-col">
      ${d.cal > 0 ? `<div class="bar-val">${d.cal}</div>` : ''}
      <div class="bar ${d.isToday ? 'today' : ''}" style="height:${120 * d.cal / maxVal}px"></div>
      <div class="bar-label ${d.isToday ? 'today' : ''}">周${weekday(d.ts)}</div>
    </div>`).join('');
}

/* ================================================================================
 * Tab 切换
 * ================================================================================ */
function switchTab(name) {
  currentTab = name;
  const isRecord = name === 'record';
  document.getElementById('pageRecord').style.display = isRecord ? '' : 'none';
  document.getElementById('pageStats').style.display = isRecord ? 'none' : '';
  document.getElementById('tabRecord').classList.toggle('active', isRecord);
  document.getElementById('tabStats').classList.toggle('active', !isRecord);
  document.getElementById('fab').style.display = isRecord ? '' : 'none';
  document.getElementById('dateNav').style.display = isRecord ? '' : 'none';
  document.getElementById('headerTitle').textContent = isRecord ? '健身记录' : '周统计';
  if (!isRecord) renderStats();
  else renderRecord();
}

/* ================================================================================
 * 日期导航
 * ================================================================================ */
function changeDay(delta) {
  currentDay = new Date(currentDay.getFullYear(), currentDay.getMonth(), currentDay.getDate() + delta);
  renderRecord();
}
function goToday() {
  currentDay = new Date();
  renderRecord();
}

/* ================================================================================
 * 添加记录：底部弹出选择菜单
 * ================================================================================ */
function showAddSheet() {
  showDialog(`
    <h3>添加记录</h3>
    <div class="menu-item" onclick="closeDialog();showFoodDialog()">
      <span class="mi-icon">🍽️</span> 记录饮食
    </div>
    <div class="menu-item" onclick="closeDialog();showExDialog()">
      <span class="mi-icon">🏃</span> 记录运动
    </div>
    <div class="btns" style="margin-top:14px;">
      <button class="btn-cancel" onclick="closeDialog()">取消</button>
    </div>
  `);
}

/* ================================================================================
 * 饮食：添加 / 编辑 / 删除
 * ================================================================================ */
function showFoodDialog(editId) {
  const list = load(LS.food);
  const item = editId ? list.find(r => r.id === editId) : null;
  const title = item ? '编辑饮食' : '记录饮食';
  showDialog(`
    <h3>${title}</h3>
    <input id="fName" placeholder="食物名称，如 鸡胸肉" value="${item ? esc(item.name) : ''}">
    <input id="fCal" type="number" placeholder="热量(千卡)，如 180" value="${item ? item.cal : ''}">
    <div class="btns">
      <button class="btn-cancel" onclick="closeDialog()">取消</button>
      ${item ? `<button class="btn-danger" onclick="delFood(${item.id})">删除</button>` : ''}
      <button class="btn-save" onclick="saveFood(${editId || 0})">保存</button>
    </div>
  `);
  setTimeout(() => document.getElementById('fName').focus(), 100);
}
function saveFood(editId) {
  const name = document.getElementById('fName').value.trim();
  const cal = parseInt(document.getElementById('fCal').value);
  if (!name) return toast('请输入名称');
  if (!cal || cal <= 0) return toast('请输入大于0的热量');

  const list = load(LS.food);
  if (editId) {
    // 编辑：找到并更新
    const idx = list.findIndex(r => r.id === editId);
    if (idx < 0) return toast('记录不存在');
    list[idx] = { ...list[idx], name, cal };
  } else {
    // 新增：使用当前查看日期的时间（如果是历史日期，用当天中午）
    const ts = new Date(currentDay.getFullYear(), currentDay.getMonth(),
                        currentDay.getDate(), 12, 0).getTime();
    list.push({ id: nextId(list), name, cal, ts });
  }
  save(LS.food, list);
  closeDialog();
  renderRecord();
  toast(editId ? '已更新' : '已保存');
}
function editFood(id) { showFoodDialog(id); }
function delFood(id) {
  if (!confirm('删除该条饮食记录？')) return;
  save(LS.food, load(LS.food).filter(r => r.id !== id));
  closeDialog();
  renderRecord();
  toast('已删除');
}

/* ================================================================================
 * 运动：添加 / 编辑 / 删除
 * ================================================================================ */
const EX_PRESETS = ['跑步','快走','骑行','俯卧撑','深蹲','瑜伽','游泳','跳绳','哑铃','平板支撑'];

function showExDialog(editId) {
  const list = load(LS.ex);
  const item = editId ? list.find(r => r.id === editId) : null;
  const title = item ? '编辑运动' : '记录运动';
  showDialog(`
    <h3>${title}</h3>
    <input id="eType" placeholder="运动类型，如 跑步" value="${item ? esc(item.type) : ''}">
    <div class="chips">${EX_PRESETS.map(t =>
      `<button class="chip ${item && item.type === t ? 'active' : ''}" onclick="pickType(this,'${t}')">${t}</button>`
    ).join('')}</div>
    <input id="eDur" type="number" placeholder="时长(分钟)，如 30" value="${item ? item.dur : ''}">
    <input id="eCal" type="number" placeholder="消耗(千卡)，如 240" value="${item ? item.cal : ''}">
    <div class="btns">
      <button class="btn-cancel" onclick="closeDialog()">取消</button>
      ${item ? `<button class="btn-danger" onclick="delEx(${item.id})">删除</button>` : ''}
      <button class="btn-save" onclick="saveEx(${editId || 0})">保存</button>
    </div>
  `);
  setTimeout(() => document.getElementById('eType').focus(), 100);
}
function pickType(btn, type) {
  document.getElementById('eType').value = type;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
}
function saveEx(editId) {
  const type = document.getElementById('eType').value.trim();
  const dur = parseInt(document.getElementById('eDur').value);
  const cal = parseInt(document.getElementById('eCal').value);
  if (!type) return toast('请输入运动类型');
  if (!dur || dur <= 0) return toast('请输入大于0的时长');
  if (!cal || cal <= 0) return toast('请输入大于0的消耗');

  const list = load(LS.ex);
  if (editId) {
    const idx = list.findIndex(r => r.id === editId);
    if (idx < 0) return toast('记录不存在');
    list[idx] = { ...list[idx], type, dur, cal };
  } else {
    const ts = new Date(currentDay.getFullYear(), currentDay.getMonth(),
                        currentDay.getDate(), 12, 0).getTime();
    list.push({ id: nextId(list), type, dur, cal, ts });
  }
  save(LS.ex, list);
  closeDialog();
  renderRecord();
  toast(editId ? '已更新' : '已保存');
}
function editEx(id) { showExDialog(id); }
function delEx(id) {
  if (!confirm('删除该条运动记录？')) return;
  save(LS.ex, load(LS.ex).filter(r => r.id !== id));
  closeDialog();
  renderRecord();
  toast('已删除');
}

/* ================================================================================
 * 数据导出 / 导入
 * ================================================================================ */
function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    food: load(LS.food),
    exercise: load(LS.ex),
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fitness_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('备份已导出');
}
function importData() {
  document.getElementById('importFile').click();
}
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.food || !data.exercise) throw new Error('格式不对');
    if (!confirm(`将导入 ${data.food.length} 条饮食 + ${data.exercise.length} 条运动记录，\n会覆盖现有数据，确认？`)) return;
    save(LS.food, data.food);
    save(LS.ex, data.exercise);
    renderRecord();
    toast('导入成功');
  } catch (err) {
    toast('导入失败：文件格式不正确');
  }
  e.target.value = ''; // 重置，允许重复导入同一文件
});

/* ================================================================================
 * 弹窗与 Toast 工具
 * ================================================================================ */
function showDialog(html) {
  document.getElementById('dialog').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeDialog() {
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay') closeDialog();
});
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function openPose() {
    try {
        var b64 = POSE_HTML_B64;
        // base64 解码为二进制字符串
        var binary = atob(b64);
        var len = binary.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
        // 创建 Blob 并导航
        var blob = new Blob([bytes], {type: 'text/html;charset=utf-8'});
        var url = URL.createObjectURL(blob);
        location.href = url;
    } catch (e) {
        alert('无法打开动作检测页面: ' + e.message);
    }
}
